name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/cocoon.jks
          else
            echo "::warning::KEYSTORE_BASE64 not set: APK is signed with a throwaway key and cannot update a previous install."
          fi

      - name: Test and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon 2>&1 | tee build.log

      # Surfaces compiler and test errors on the run page without opening the log.
      - name: Report errors
        if: failure()
        run: |
          msg=$(grep -E '^(e: |FAILURE|\* What went wrong|> |.* FAILED$)|error:' build.log | head -60 \
            | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::${msg:-see log}"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk cocoon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cocoon-apk
          path: cocoon.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 \
            || gh release create latest --title "Latest build" --notes "Built from main by CI."
          gh release upload latest cocoon.apk --clobber
